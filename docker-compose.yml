version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL Database Container
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: seek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seek_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seek_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-seek_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seek_user} -d ${POSTGRES_DB:-seek_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Backend API Container (FastAPI)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: seek-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-seek_user}:${POSTGRES_PASSWORD:-seek_dev_password}@postgres:5432/${POSTGRES_DB:-seek_db}
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./indexes:/app/indexes
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------
  # Frontend UI Container (React + Vite)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: seek-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
